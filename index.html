<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello There</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/pineapple.png" type="image/png">
</head>

<body>
  <!-- Mac OS Boot-up Video Preloader -->
  <div class="preloader" id="preloader">
    <video class="boot-video" autoplay muted preload="auto" id="bootVideo">
      <source src="boot-up-video.mp4" type="video/mp4">
      <!-- Fallback for browsers that don't support video -->
      <div class="loading-fallback">
        <h2>Starting up...</h2>
        <p>Please wait</p>
      </div>
    </video>
    <button class="skip-button" id="skipButton">Skip</button>
  </div>

  <!-- Main Website Content -->
  <div class="main-content" id="mainContent">
    <!-- Time Section -->
    <div class="status-bar">
      <div class="left-content">
        <div class="time" id="currentTime">--:--</div>
      </div>

      <!-- Battery/Wifi/Cellular Section -->
      <div class="right-content">
        <object data="icons/cellular-connection.svg" type="image/svg+xml" class="icon"></object>
        <object data="icons/wifi.svg" type="image/svg+xml" class="icon"></object>
        <svg id="battery-icon" width="28" height="13" viewBox="0 0 28 13" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="icon">
          <rect opacity="0.35" x="0.506836" y="0.5" width="24" height="12" rx="3.8" stroke="white" />
          <path opacity="0.4"
            d="M26.0068 4.78113V8.8566C26.8116 8.51143 27.3349 7.70847 27.3349 6.81886C27.3349 5.92926 26.8116 5.1263 26.0068 4.78113Z"
            fill="white" />
          <rect id="battery-fill" x="2.00684" y="2" width="21" height="9" rx="2.5" fill="white" />
        </svg>
      </div>
    </div>

    <!-- Desktop Resume Icon -->
    <div class="desktop-icon" id="resumeIcon">
      <div class="desktop-icon-img">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" fill="none">
          <rect x="2" y="2" width="56" height="68" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)"
            stroke-width="1.5" />
          <path d="M38 2v16h16" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" />
          <path d="M38 2l16 16" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
          <rect x="11" y="30" width="28" height="2.5" rx="1.25" fill="rgba(255,255,255,0.7)" />
          <rect x="11" y="38" width="22" height="2.5" rx="1.25" fill="rgba(255,255,255,0.5)" />
          <rect x="11" y="46" width="25" height="2.5" rx="1.25" fill="rgba(255,255,255,0.5)" />
          <rect x="11" y="54" width="18" height="2.5" rx="1.25" fill="rgba(255,255,255,0.35)" />
          <text x="30" y="22" text-anchor="middle" fill="rgba(255,82,82,0.9)" font-size="9"
            font-family="SF Pro Display, Inter, sans-serif" font-weight="700">PDF</text>
        </svg>
      </div>
      <div class="desktop-icon-label">Resume.pdf</div>
    </div>

    <!-- Resume Window Overlay -->
    <div class="resume-overlay" id="resumeOverlay"></div>

    <!-- Resume Window -->
    <div class="resume-window" id="resumeWindow">
      <div class="resize-handle resize-handle-n" data-resize-handle="n"></div>
      <div class="resize-handle resize-handle-s" data-resize-handle="s"></div>
      <div class="resize-handle resize-handle-e" data-resize-handle="e"></div>
      <div class="resize-handle resize-handle-w" data-resize-handle="w"></div>
      <div class="resize-handle resize-handle-nw" data-resize-handle="nw"></div>
      <div class="resize-handle resize-handle-ne" data-resize-handle="ne"></div>
      <div class="resize-handle resize-handle-sw" data-resize-handle="sw"></div>
      <div class="resize-handle resize-handle-se" data-resize-handle="se"></div>
      <div class="resume-titlebar">
        <div class="traffic-lights">
          <span class="tl tl-red" id="resumeClose"></span>
          <span class="tl tl-yellow"></span>
          <span class="tl tl-green"></span>
        </div>
        <span class="resume-title">Resume.pdf</span>
      </div>
      <div class="resume-body">
        <iframe src="resume.pdf" title="Resume"></iframe>
      </div>
    </div>

    <!-- Icons Section-->
    <div class="bottom-icons">
      <div class="icon-group" id="mac-dock">
        <div class="icon-item">
          <a href="https://github.com/Natique1415">
            <img src="icons/github.svg" alt="GitHub" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
        <div class="icon-item">
          <a href="mailto:ibrarnatique8@gmail.com">
            <img src="icons/gmail.svg" alt="Gmail" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
        <div class="icon-item">
          <a href="https://www.linkedin.com/in/natique-ibrar-alam54a6681b6/">
            <img src="icons/linkedin.svg" alt="LinkedIn" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/preloader.js"></script>
    <script src="js/time.js"></script>
    <script src="js/battery.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/resume.js"></script>
</body>

</html>
