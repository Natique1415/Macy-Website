<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>~/natique</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/pineapple.png" type="image/png">
</head>

<body>
  <!-- Mac OS Boot-up Video Preloader -->
  <div class="preloader" id="preloader">
    <video class="boot-video" autoplay muted preload="auto" id="bootVideo">
      <source src="boot-up-video.mp4" type="video/mp4">
      <!-- Fallback for browsers that don't support video -->
      <div class="loading-fallback">
        <h2>Starting up...</h2>
        <p>Please wait</p>
      </div>
    </video>
    <button class="skip-button" id="skipButton">Skip</button>
  </div>

  <!-- Main Website Content -->
  <div class="main-content" id="mainContent">
    <!-- Time Section -->
    <div class="status-bar">
      <div class="left-content">
        <div class="time" id="currentTime">--:--</div>
      </div>

      <!-- Battery/Wifi/Cellular Section -->
      <div class="right-content">
        <button class="spotlight-trigger" id="spotlightTrigger" aria-label="Open Spotlight search">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2" />
            <path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="menu-clock" id="menuClock">--:-- --</div>
        <object data="icons/cellular-connection.svg" type="image/svg+xml" class="icon"></object>
        <object data="icons/wifi.svg" type="image/svg+xml" class="icon"></object>
        <svg id="battery-icon" width="28" height="13" viewBox="0 0 28 13" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="icon">
          <rect opacity="0.35" x="0.506836" y="0.5" width="24" height="12" rx="3.8" stroke="white" />
          <path opacity="0.4"
            d="M26.0068 4.78113V8.8566C26.8116 8.51143 27.3349 7.70847 27.3349 6.81886C27.3349 5.92926 26.8116 5.1263 26.0068 4.78113Z"
            fill="white" />
          <rect id="battery-fill" x="2.00684" y="2" width="21" height="9" rx="2.5" fill="white" />
        </svg>
      </div>
    </div>

    <!-- Spotlight Search -->
    <div class="spotlight-overlay" id="spotlightOverlay" aria-hidden="true">
      <div class="spotlight-panel" role="dialog" aria-modal="true" aria-label="Spotlight search">
        <div class="spotlight-search-row">
          <svg class="spotlight-search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="2" />
            <path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input id="spotlightInput" class="spotlight-input" type="text" autocomplete="off" spellcheck="false"
            placeholder="Spotlight Search" />
        </div>
        <div class="spotlight-results" id="spotlightResults" role="listbox"></div>
      </div>
    </div>

    <!-- Icons Section-->
    <div class="bottom-icons">
      <div class="icon-group" id="mac-dock">
        <div class="icon-item">
          <a href="https://github.com/Natique1415" target="_blank">
            <img src="icons/github.svg" alt="GitHub" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
        <div class="icon-item">
          <a href="mailto:ibrarnatique8@gmail.com" target="_blank">
            <img src="icons/gmail.svg" alt="Gmail" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
        <div class="icon-item">
          <a href="https://www.linkedin.com/in/natique-ibrar-alam54a6681b6/" target="_blank">
            <img src="icons/linkedin.svg" alt="LinkedIn" class="social-icon" />
          </a>
          <div class="icon-label"></div>
        </div>
      </div>
    </div>

    <!-- Mobile Center Content -->
    <div class="mobile-center-content">
      <h1 class="mobile-name">Natique Ibrar Alam</h1>
      <a href="desktop-files/resume.pdf" target="_blank" class="mobile-resume-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" fill="none">
          <rect x="2" y="2" width="56" height="68" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.35)"
            stroke-width="1.5" />
          <path d="M38 2v16h16" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" />
          <path d="M38 2l16 16" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />
          <rect x="11" y="32" width="28" height="2.5" rx="1.25" fill="rgba(255,255,255,0.7)" />
          <rect x="11" y="40" width="22" height="2.5" rx="1.25" fill="rgba(255,255,255,0.5)" />
          <rect x="11" y="48" width="25" height="2.5" rx="1.25" fill="rgba(255,255,255,0.5)" />
          <text x="30" y="23" text-anchor="middle" fill="rgba(255,82,82,0.9)" font-size="8.5"
            font-family="SF Pro Display, Inter, sans-serif" font-weight="700">PDF</text>
        </svg>
        <span class="mobile-resume-label">Resume.pdf</span>
      </a>
    </div>

    <!-- Scripts -->
    <script src="js/preloader.js"></script>
    <script src="js/time.js"></script>
    <script src="js/battery.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/resume.js"></script>
    <script src="js/spotlight.js"></script>
    <script src="js/desktop-files.js"></script>
</body>

</html>
